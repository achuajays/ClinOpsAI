input {
  # Read from log files
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2}"
      negate => true
      what => "previous"
    }
  }

  # Listen on TCP port 5000
  tcp {
    port => 5000
    codec => json
  }

  # Listen on UDP port 5000
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse ClinOps AI logs
  if [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{DATA:logger} - %{LOGLEVEL:level} - %{GREEDYDATA:log_message}"
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Extract additional fields
    if [log_message] =~ /Urgency/ {
      mutate {
        add_field => { "event_type" => "urgency_detection" }
      }
    }
    
    if [log_message] =~ /Analysis/ {
      mutate {
        add_field => { "event_type" => "analysis" }
      }
    }
    
    if [log_message] =~ /Error/ or [log_message] =~ /Failed/ {
      mutate {
        add_field => { "event_type" => "error" }
        add_tag => [ "error" ]
      }
    }
  }
  
  # Add application metadata
  mutate {
    add_field => {
      "application" => "clinops-ai"
      "environment" => "${ENVIRONMENT:development}"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "clinops-ai-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output (optional - comment out in production)
  stdout {
    codec => rubydebug
  }
}
